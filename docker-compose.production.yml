name: clinly-production

services:
  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: prod
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_TITLE: ${API_TITLE:-Clinly Backbone}
      API_VERSION: ${API_VERSION:-1.0.0}
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-clinly}
      MONGO_CONNECT_TIMEOUT_MS: ${MONGO_CONNECT_TIMEOUT_MS:-3000}
      MONGO_SERVER_SELECTION_TIMEOUT_MS: ${MONGO_SERVER_SELECTION_TIMEOUT_MS:-3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:?MESSAGE_ENCRYPTION_KEY is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_IP_MAX_ATTEMPTS:-20}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    networks:
      - private

  web:
    build:
      context: ./web
      target: runtime
      args:
        VITE_APP_NAME: ${APP_DISPLAY_NAME:-Clinly}
        VITE_APP_TAGLINE: ${APP_TAGLINE:-One relationship. One connected place.}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CLINLY_HTTP_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - private

networks:
  private:
    driver: bridge
