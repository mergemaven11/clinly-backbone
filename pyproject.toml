[tool.poetry]
name = "clinly-backbone"
version = "1.0.0"
description = "Clinly Backbone - secure FastAPI + MongoDB messaging and audit backbone"
authors = ["tobiascodes12@gmail.com"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.141.1,<0.142.0"
starlette = ">=1.3.1,<2.0.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = ">=2.9.0,<3.0.0"
pydantic-settings = ">=2.14.2,<3.0.0"
pymongo = "^4.8.0"

bcrypt = ">=5.0.0,<6.0.0"
PyJWT = ">=2.13.0,<3.0.0"
PyNaCl = ">=1.6.2,<2.0.0"
click = ">=8.3.3,<9.0.0"
idna = ">=3.15,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.8"
httpx = "^0.27.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
