name: Apply MFA security navigation patch

on:
  push:
    branches:
      - agent/production-readiness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v7
        with:
          ref: agent/production-readiness

      - name: Apply navigation patch
        run: python scripts/patch_mfa_security_nav.py

      - name: Commit navigation update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/AppV3.jsx
          git commit -m "ui: add account Security workspace"
          git push
