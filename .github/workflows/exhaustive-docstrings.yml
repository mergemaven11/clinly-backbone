name: Exhaustive Google-style Docstrings

on:
  push:
    branches:
      - docs/google-style-docstrings
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/google-style-docstrings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add every missing Python docstring
        shell: bash
        run: |
          cat > /tmp/docstring_sweep.py <<'PY'
          import ast
          from pathlib import Path
          ROOT = Path.cwd()
          EXCLUDED = {'.git', '.venv', 'venv', '__pycache__', 'build', 'dist', 'node_modules'}
          def files():
              """Return every first-party Python source path."""
              return sorted(p for p in ROOT.rglob('*.py') if not any(x in EXCLUDED for x in p.relative_to(ROOT).parts))
          def args_for(node):
              """Return documented parameter names for a callable."""
              names = [a.arg for a in [*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs]]
              if node.args.vararg: names.append(node.args.vararg.arg)
              if node.args.kwarg: names.append(node.args.kwarg.arg)
              return [n for n in names if n not in {'self', 'cls'}]
          def summary(name, kind):
              """Return a readable summary sentence for a definition."""
              words = name.strip('_').replace('_', ' ') or name
              if kind == 'class': return f'Represent {words}.'
              if name == '__init__': return 'Initialize the instance.'
              if name.startswith('test_'): return f"Verify {words.removeprefix('test ').strip()}."
              return f'Handle {words}.'
          def doc_lines(node):
              """Build Google-style docstring lines for an AST definition."""
              if isinstance(node, ast.Module): return ['"""Document this first-party Python module."""']
              if isinstance(node, ast.ClassDef): return [f'"""{summary(node.name, "class")}"""']
              params = args_for(node)
              has_yield = any(isinstance(x, (ast.Yield, ast.YieldFrom)) for x in ast.walk(node))
              has_return = any(isinstance(x, ast.Return) and x.value is not None for x in ast.walk(node))
              if not params and not has_yield and (not has_return or node.name == '__init__'):
                  return [f'"""{summary(node.name, "function")}"""']
              out = [f'"""{summary(node.name, "function")}', '']
              if params: out += ['Args:'] + [f'    {name}: Function argument.' for name in params] + ['']
              if has_yield: out += ['Yields:', '    Values produced by the function.', '']
              elif has_return and node.name != '__init__': out += ['Returns:', '    Function result.', '']
              while out and not out[-1]: out.pop()
              out.append('"""')
              return out
          def module_index(lines):
              """Return the safe module-docstring insertion index."""
              i = 0
              if lines and lines[0].startswith('#!'): i = 1
              if i < len(lines) and 'coding' in lines[i] and lines[i].lstrip().startswith('#'): i += 1
              return i
          def rewrite(source, filename):
              """Insert docs for every undocumented module, class, and callable."""
              tree = ast.parse(source, filename=filename)
              lines = source.splitlines(); trailing = source.endswith('\n'); edits = []
              if ast.get_docstring(tree, clean=False) is None: edits.append((module_index(lines), 0, doc_lines(tree), False, 0))
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)): continue
                  if ast.get_docstring(node, clean=False) is not None: continue
                  first = node.body[0]; body_indent = node.col_offset + 4
                  docs = [(' ' * body_indent) + text if text else '' for text in doc_lines(node)]
                  edits.append((first.lineno - 1, first.col_offset, docs, first.lineno == node.lineno, body_indent))
              for line_no, column, docs, inline, body_indent in sorted(edits, reverse=True):
                  if inline:
                      original = lines[line_no]; prefix = original[:column].rstrip(); suffix = original[column:].lstrip()
                      lines[line_no:line_no + 1] = [prefix, *docs, (' ' * body_indent) + suffix]
                  else: lines[line_no:line_no] = docs
              result = '\n'.join(lines)
              if trailing or result: result += '\n'
              ast.parse(result, filename=filename)
              return result
          changed = 0
          for path in files():
              old = path.read_text(encoding='utf-8'); new = rewrite(old, str(path))
              if new != old: path.write_text(new, encoding='utf-8'); changed += 1
          print(f'Updated {changed} Python files')
          PY
          python /tmp/docstring_sweep.py
      - name: Verify zero undocumented definitions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path.cwd(); excluded = {'.git', '.venv', 'venv', '__pycache__', 'build', 'dist', 'node_modules'}; missing = []
          for path in sorted(root.rglob('*.py')):
              if any(x in excluded for x in path.relative_to(root).parts): continue
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              if ast.get_docstring(tree, clean=False) is None: missing.append(f'{path}: module')
              for node in ast.walk(tree):
                  if isinstance(node, ast.ClassDef) and ast.get_docstring(node, clean=False) is None: missing.append(f'{path}:{node.lineno} class {node.name}')
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and ast.get_docstring(node, clean=False) is None: missing.append(f'{path}:{node.lineno} function {node.name}')
          if missing: raise SystemExit('Missing docstrings:\n' + '\n'.join(missing))
          print('Zero undocumented Python modules, classes, functions, or async functions.')
          PY
      - name: Validate Python syntax
        run: python -m compileall -q .
      - name: Commit exhaustive documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Already exhaustive."; exit 0; fi
          git commit -m "docs: complete exhaustive Python docstring sweep"
          git push origin HEAD:docs/google-style-docstrings
