name: Apply production TLS test fixture patch

on:
  push:
    branches:
      - agent/production-readiness

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out production branch
        uses: actions/checkout@v7
        with:
          ref: agent/production-readiness

      - name: Patch production Mongo test fixture
        run: python scripts/patch_prod_tls_test_fixture.py

      - name: Commit fixture update
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_hardening.py
          git commit -m "test: use TLS in production Mongo fixture"
          git push
