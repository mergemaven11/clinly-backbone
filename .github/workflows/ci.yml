name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: dev
      LOG_LEVEL: INFO
      API_TITLE: Clinly Backbone
      API_VERSION: 1.0.0
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB_NAME: clinly_ci
      TEST_MONGO_URI: mongodb://localhost:27017
      JWT_SECRET: ci-placeholder-not-for-production
      MESSAGE_ENCRYPTION_KEY: fFauOTt3BH8g9ZW7qzMjYBlq4WqrbGzZkr0KQINCO3c=
      CORS_ALLOWED_ORIGINS: "[]"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install project
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check app tests

      - name: Test
        run: poetry run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --prefix web --no-fund

      - name: Audit frontend dependencies
        run: npm audit --prefix web --audit-level=high

      - name: Test frontend
        run: npm test --prefix web

      - name: Build frontend
        run: npm run build --prefix web

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install audit tooling
        run: pip install poetry poetry-plugin-export pip-audit

      - name: Export locked runtime dependencies
        run: >-
          poetry export --only main --without-hashes
          --format requirements.txt --output requirements-audit.txt

      - name: Audit locked dependencies
        shell: bash
        run: |
          set +e
          audit_output="$(pip-audit -r requirements-audit.txt 2>&1)"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_output"
          if [ "$audit_status" -ne 0 ]; then
            escaped="${audit_output//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error title=Dependency vulnerability audit::$escaped"
            exit "$audit_status"
          fi

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production API image
        run: docker build --tag clinly-backbone:ci .

      - name: Build production web image
        run: docker build --tag clinly-web:ci web

  stack-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare local development environment
        run: cp .env.example .env

      - name: Start full stack
        run: docker compose up --build --detach

      - name: Verify web and proxied API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:3000/api/health | grep -q '"status":"ok"' \
              && curl --fail --silent --show-error http://127.0.0.1:3000/api/ready | grep -q '"status":"ready"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop full stack
        if: always()
        run: docker compose down --volumes --remove-orphans
